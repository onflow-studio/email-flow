name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pushes and pull requests from this repository run on the org's own ci-flow runner (a
    # fresh container per job). A fork's pull request never does: it runs on GitHub-hosted
    # Ubuntu, after an owner approves it.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "email-flow"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # None of these need secrets or a database.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
