name: superfer

services:
  postgres:
    # pgvector is for the planned semantic search (phase 1.5). No migration enables it yet;
    # until then it works as plain Postgres 16.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: superfer
      POSTGRES_PASSWORD: superfer
      POSTGRES_DB: superfer
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superfer -d superfer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
